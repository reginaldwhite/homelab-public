# The Alexa bridge: ha-bridge pretends to be a Philips Hue bridge; the Echos discover a light
# called "Plex" over the LAN and send on/off to it directly. Amazon's cloud hears the words; the
# command never leaves the house. plex.py does the work (WoL broadcast; suspend over SSH with a
# key cinema pins to its forced command).
#
# Its own LAN address, 192.168.0.11, through a macvlan on bastion's interface: the Echo insists
# on finding a Hue bridge on port 80, and bastion's port 80 is Caddy's. A macvlan container is a
# separate host on the LAN as far as the Echos (and ufw) are concerned -- no ufw rules needed,
# and it cannot talk to bastion itself, which it never needs to. .11 is reserved in the register.
#
# Only Plex has a voice device, on purpose: Hue lights carry no authentication, so anyone who
# can talk to an Echo (the children included) can flip them. The sauna and the kids' internet
# stay off this bridge. Devices are defined in ha-bridge's own database (data volume), created
# once through its API or UI; see README.
services:
  alexa:
    build: .
    image: homelab/alexa:local
    container_name: alexa
    restart: unless-stopped
    networks:
      lan:
        ipv4_address: 192.168.0.11
    environment:
      - TZ=America/Chicago
    volumes:
      - /home/robby/.ssh/alexa_ed25519:/keys/alexa_ed25519:ro
      - /home/robby/logs:/log
      - alexa_data:/ha-bridge/data
      - alexa_state:/state

networks:
  lan:
    driver: macvlan
    driver_opts:
      parent: enp3s0
    ipam:
      config:
        - subnet: 192.168.0.0/24
          gateway: 192.168.0.1
          ip_range: 192.168.0.11/32

volumes:
  alexa_data:
  alexa_state:
