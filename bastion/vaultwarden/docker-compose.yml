# Deployed to bastion by ../../deploy.sh and run from /home/robby/homelab-deployed/bastion/vaultwarden.
#
# Pinned so the caddy_data/caddy_config volumes (TLS certs) stay attached as
# vaultwarden_caddy_* no matter where this file is run from.
name: vaultwarden

# Live data stays outside the git working tree, at the path backup-to-tower.sh
# pushes to vault. Absolute paths mean a branch switch or a fresh clone can
# never point a container at an empty data directory.

services:
  vaultwarden:
    # Pinned deliberately: client compatibility is version-sensitive.
    # 1.37.2+ is required for Bitwarden clients 2026.8.0 and newer.
    # Bump this tag to upgrade, then ./deploy.sh bastion (it backs up vw-data first).
    image: vaultwarden/server:1.37.3
    container_name: vaultwarden
    restart: unless-stopped
    volumes:
      - /home/robby/vaultwarden/vw-data:/data
    environment:
      - DOMAIN=https://vault.robbywhite.net
      - SIGNUPS_ALLOWED=false
    ports:
      # Loopback only. Caddy reaches this over the compose network as vaultwarden:80,
      # so nothing ever needed the published port — but until 2026-09-26 it was bound
      # to every interface, which served the vault over plaintext HTTP to the whole
      # LAN at http://192.168.0.10:8080, master password hashes included.
      # Kept on 127.0.0.1 because `curl localhost:8080` on bastion is what separates
      # "Vaultwarden is down" from "Caddy is down".
      - 127.0.0.1:8080:80
  caddy:
    image: caddy:latest
    container_name: caddy
    restart: unless-stopped
    ports:
      - 80:80
      - 443:443
    volumes:
      # Mount the directory, not the file: a single-file bind mount pins the
      # inode, and git replaces files rather than editing them in place, so after
      # a pull or branch switch the container kept serving the old Caddyfile and
      # `caddy reload` silently reloaded stale config.
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
  adguardhome:
    image: adguard/adguardhome
    container_name: adguardhome
    restart: unless-stopped
    network_mode: "host"
    volumes:
      - /home/robby/vaultwarden/agh-work:/opt/adguardhome/work
      - /home/robby/vaultwarden/agh-conf:/opt/adguardhome/conf

volumes:
  caddy_data:
  caddy_config:
