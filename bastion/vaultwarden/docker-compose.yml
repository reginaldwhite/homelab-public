services:
  vaultwarden:
    # Pinned deliberately: client compatibility is version-sensitive.
    # 1.37.2+ is required for Bitwarden clients 2026.8.0 and newer.
    # Bump this tag to upgrade, then: docker compose pull vaultwarden && docker compose up -d vaultwarden
    image: vaultwarden/server:1.37.3
    container_name: vaultwarden
    restart: unless-stopped
    volumes:
      - ./vw-data:/data
    environment:
      - DOMAIN=https://vault.robbywhite.net
      - SIGNUPS_ALLOWED=false
    ports:
      - 8080:80
  caddy:
    image: caddy:latest
    container_name: caddy
    restart: unless-stopped
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
  adguardhome:
    image: adguard/adguardhome
    container_name: adguardhome
    restart: unless-stopped
    network_mode: "host"
    volumes:
      - ./agh-work:/opt/adguardhome/work
      - ./agh-conf:/opt/adguardhome/conf

volumes:
  caddy_data:
  caddy_config:

