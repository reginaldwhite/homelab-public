# blackbox exporter modules. Referenced by name from prometheus/prometheus.yml.
modules:
  # A client's view of an HTTPS service: status 200, TLS valid, IPv4 only (the LAN has no
  # routed IPv6). probe_ssl_earliest_cert_expiry comes out of this one for free.
  http_2xx:
    prober: http
    timeout: 10s
    http:
      method: GET
      preferred_ip_protocol: ip4
      valid_status_codes: [200]
      fail_if_not_ssl: true

  # Ask AdGuard for the vault's name and insist on the LAN answer. Anything else means the
  # rewrite is gone and clients are hairpinning through the router again.
  dns_vault_rewrite:
    prober: dns
    timeout: 5s
    dns:
      query_name: vault.robbywhite.net
      query_type: A
      preferred_ip_protocol: ip4
      validate_answer_rrs:
        fail_if_not_matches_regexp:
          - 'vault\.robbywhite\.net\.\t.*\tIN\tA\t192\.168\.0\.10'

  icmp:
    prober: icmp
    timeout: 5s
    icmp:
      preferred_ip_protocol: ip4

  # Ask AdGuard for a public name, so upstream trouble is visible: a local rewrite can answer
  # from AdGuard's own table while every real lookup waits on a dead bootstrap resolver
  # (2026-10-14, Quad9's port 53 unreachable for a day). Any answer will do; the point is time.
  dns_public:
    prober: dns
    timeout: 5s
    dns:
      query_name: example.com
      query_type: A
      preferred_ip_protocol: ip4
