# Dashboards are files in git, loaded from the read-only mount, never edited in the UI: an
# edit made there is lost on the next deploy, which is the point -- the repo is the record.
apiVersion: 1

providers:
  - name: homelab
    orgId: 1
    folder: Homelab
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 60
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
