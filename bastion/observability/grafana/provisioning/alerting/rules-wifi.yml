# Alert rules for the WiFi controllers' client data (docs/plan-wifi.md, phase 4; added
# 2026-10-10). Evaluated every 5 minutes against the gauges wifi-clients.py writes.
#
#   wifi-weak-signal   a client on an IoT SSID (WhiteHouse_IoT on the AC Lite, WhiteHouse_IoT_Lan
#                      on the EAP772) has heard its AP below -70 dBm for a full hour -- the state
#                      the sauna controller was in on the EAP772. Selected by SSID rather than
#                      by controller="unifi" (2026-10-13): both APs now carry an IoT SSID, so a
#                      device that roams changes its controller label and would have dropped out
#                      of the rule mid-problem. The selector already matches what phase 4 of the
#                      AC Lite's retirement needs, so it does not change again when UniFi goes.
#   wifi-poll-failed   wifi-clients.py could not read a controller for 30 minutes
#   wifi-ap-rebooted   an Omada AP's uptime is under 15 minutes: it rebooted (added 2026-10-11,
#                      the day the EAP772 turned out to have rebooted ~30 times on firmware
#                      1.3.2 with nothing saying so). Fires once per reboot and resolves on its
#                      own; if it stays firing, the AP is in a loop.
apiVersion: 1
groups:
  - orgId: 1
    name: wifi
    folder: Homelab
    interval: 5m
    rules:
      - uid: wifi-weak-signal
        title: IoT device with a weak WiFi signal
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels: { severity: warning, host: bastion }
        annotations:
          summary: '{{ $labels.name }} ({{ $labels.mac }}) has been below -70 dBm on {{ $labels.ap }} ({{ $labels.ssid }}) for an hour (now {{ $values.B }} dBm). Move the device, the AP, or raise its power; at this level cloud connections drop.'
          runbook: docs/plan-wifi.md
        data:
          - refId: A
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              editorMode: code
              expr: 'max_over_time(wifi_client_signal_dbm{ssid=~"WhiteHouse_IoT.*"}[1h])'
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last, datasource: { type: __expr__, uid: __expr__ } }
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: B, datasource: { type: __expr__, uid: __expr__ }, conditions: [ { evaluator: { type: lt, params: [-70] } } ] }
      - uid: wifi-poll-failed
        title: WiFi controller poll failing
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels: { severity: warning, host: bastion }
        annotations:
          summary: 'wifi-clients.py has not been able to read the {{ $labels.controller }} controller for 30 minutes (~/logs/wifi-clients.log on bastion). The Network dashboard''s wireless columns are stale until it recovers; the APs themselves are unaffected.'
          runbook: docs/plan-wifi.md
        data:
          - refId: A
            relativeTimeRange: { from: 1800, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              editorMode: code
              expr: 'max_over_time(wifi_poll_ok[30m])'
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last, datasource: { type: __expr__, uid: __expr__ } }
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: B, datasource: { type: __expr__, uid: __expr__ }, conditions: [ { evaluator: { type: lt, params: [1] } } ] }
      - uid: wifi-ap-rebooted
        title: Access point rebooted
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels: { severity: warning, host: bastion }
        annotations:
          summary: 'AP {{ $labels.ap }} ({{ $labels.mac }}) has been up only {{ $values.B }} s: it rebooted. Every wireless client re-joined. One of these after a firmware update or a power cut is expected; repeats mean a crash loop (docs/plan-wifi.md, Finding 2026-10-11) or a power problem at its PoE adapter.'
          runbook: docs/plan-wifi.md
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              editorMode: code
              expr: 'wifi_ap_uptime_seconds'
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last, datasource: { type: __expr__, uid: __expr__ } }
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: B, datasource: { type: __expr__, uid: __expr__ }, conditions: [ { evaluator: { type: lt, params: [900] } } ] }
