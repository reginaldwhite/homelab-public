# Grafana contact points, provisioned from git (observability plan, phase 3).
# One point: the Slack bot posting to #homelab-status, the same channel the digester uses.
# The token is expanded from the Grafana container's environment (SLACK_BOT_TOKEN from
# bastion's .env); nothing secret is in this file.
apiVersion: 1
contactPoints:
  - orgId: 1
    name: homelab-status
    receivers:
      - uid: slack-homelab-status
        type: slack
        settings:
          token: $SLACK_BOT_TOKEN
          recipient: C0C3MAXLSRK
          username: grafana
          title: '{{ template "default.title" . }}'
          text: '{{ template "default.message" . }}'
