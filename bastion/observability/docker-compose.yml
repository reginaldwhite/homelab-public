# Observability stack on bastion: Prometheus, Grafana, blackbox, node exporter, cAdvisor.
# Deployed by ../apply.sh from /home/robby/homelab-deployed/bastion/observability; validated
# (compose config, promtool, blackbox --config.check, dashboard JSON) before anything applies.
# Design and phasing: docs/plan-observability.md.
#
# Two networking rules, both deliberate:
#   * Two networks. `internal` is this project's own bridge and is where everything talks to
#     everything: Grafana to its stores, Prometheus to blackbox, Alloy to Loki and to the
#     Docker socket proxy. Only Grafana and Loki ALSO join the vaultwarden stack's network,
#     because Caddy has to reverse-proxy those two by service name. Nothing here publishes a
#     port on the LAN. The split matters: the socket proxy returns every container's
#     environment (passwords included) to anyone who can reach it, and Prometheus and Loki
#     answer without authentication -- so the internet-facing Caddy container must not share a
#     network with them. Found 2026-09-27, when it did.
#   * node exporter and cAdvisor run in host network mode, because that is how they see the
#     host's interfaces and cgroups, and because a host firewall then applies to them (Docker's
#     own port publishing bypasses ufw). Same shape on forge and cinema, same ports.
#
# Pinned tags, like everything else here. Bump from the runbooks in
# .claude/skills/homelab-upgrades/packages/.
name: observability

services:
  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=90d
      - --storage.tsdb.retention.size=8GB
      - --web.enable-lifecycle
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    networks:
      - internal

  blackbox:
    image: prom/blackbox-exporter:v0.28.0
    container_name: blackbox
    restart: unless-stopped
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    volumes:
      - ./blackbox:/etc/blackbox:ro
    # ICMP needs a raw socket; the image drops everything else.
    cap_add:
      - NET_RAW
    # Resolve through AdGuard, not Docker's fallback resolver: the vault probe must see the
    # LAN rewrite, exactly as a phone on the WiFi does.
    dns:
      - 192.168.0.10
    networks:
      - internal

  grafana:
    image: grafana/grafana:13.2.2
    container_name: grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=robby
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      # Encrypts data-source secrets in Grafana's own database. Without it Grafana uses a
      # published default, and the nightly copy of that database would carry the events-db
      # password in a form anyone can decrypt. Set once; changing it later means a fresh volume.
      - GF_SECURITY_SECRET_KEY=${GRAFANA_SECRET_KEY}
      - GF_SERVER_ROOT_URL=https://grafana.robbywhite.net
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES=false
      - GF_NEWS_NEWS_FEED_ENABLED=false
      # Grafana 12+ downloads and updates bundled plugins from grafana.com at start-up unless
      # told not to. Self-hosted means no surprise fetches; plugins are pinned with the image.
      - GF_PLUGINS_PREINSTALL_DISABLED=true
      # Expanded inside provisioning/datasources/*.yml for the Events data source.
      - EVENTS_DB_PASSWORD=${EVENTS_DB_PASSWORD}
      # Expanded inside provisioning/alerting/contact-points.yml: alerts post to
      # #homelab-status with the same bot the scripts use.
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN}
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/node-exporter-full.json
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - internal
      - vaultwarden_default

  loki:
    image: grafana/loki:3.7.8
    container_name: loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./loki:/etc/loki:ro
      - loki_data:/loki
    networks:
      - internal
      # Caddy's loki.robbywhite.net vhost, for the shippers on forge and cinema.
      - vaultwarden_default

  # --- log shipping (docs/plan-observability.md) ---------------------------------------------
  # Alloy reads journald and container logs and pushes them to Loki on bastion. It reaches the
  # Docker API only through the socket proxy below, which permits read-only container calls
  # and nothing else -- the real socket would be root on this host.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    container_name: docker-proxy
    restart: unless-stopped
    environment:
      - CONTAINERS=1
      # Alloy's Docker discovery also lists networks to label targets; both are GET-only.
      - NETWORKS=1
      - POST=0
      - LOG_LEVEL=warning
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - internal

  alloy:
    image: grafana/alloy:v1.20.0
    container_name: alloy
    restart: unless-stopped
    depends_on:
      - docker-proxy
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      - ALLOY_HOST=bastion
      - LOKI_URL=http://loki:3100/loki/api/v1/push
      - LOKI_USER=${LOKI_USER}
      - LOKI_PASSWORD=${LOKI_PASSWORD}
    volumes:
      # The one config for every host; shared/alloy/ lands in scripts/ on deploy.
      - ../scripts/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/log/journal:/var/log/journal:ro
      - /run/log/journal:/run/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
      - alloy_data:/var/lib/alloy/data
      # AdGuard's query log, for the adguard-querylog source in config.alloy. Root-owned on
      # the host; Alloy runs as root in its container and the mount is read-only.
      - /home/robby/vaultwarden/agh-work/data:/adguard:ro
    networks:
      - internal

  # The events store: one table of things with a start, an end and a result, and the LAN
  # client map. Written by scripts/event.sh and adguard-stats.py through `docker exec psql`,
  # read by Grafana. Never published on any port. The volume is the data; pg_dump nightly
  # (phase 2, backups) carries it to vault.
  events-db:
    image: postgres:17.6-alpine
    container_name: events-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=homelab
      - POSTGRES_PASSWORD=${EVENTS_DB_PASSWORD}
      - POSTGRES_DB=homelab
    volumes:
      - events_data:/var/lib/postgresql/data
      - ./postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homelab -d homelab"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - internal

  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: node-exporter
    restart: unless-stopped
    network_mode: host
    pid: host
    command:
      - --path.rootfs=/host
      - --collector.textfile.directory=/textfile
      - --web.listen-address=:9100
    volumes:
      - /:/host:ro,rslave
      # Where bastion's own scripts drop their .prom files (job outcomes, expected-up, AdGuard
      # stats). Created by apply.sh; read-only from here.
      - /home/robby/observability/textfile:/textfile:ro

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    container_name: cadvisor
    restart: unless-stopped
    network_mode: host
    command:
      - --port=9200
      - --housekeeping_interval=30s
      - --docker_only=true
      - --store_container_labels=false
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg

volumes:
  prometheus_data:
  grafana_data:
  loki_data:
  alloy_data:
  events_data:

networks:
  internal:
    name: observability_internal
  vaultwarden_default:
    external: true
