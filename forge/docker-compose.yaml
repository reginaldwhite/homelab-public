# Project name is pinned so volume names don't depend on this folder's path.
name: forge

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      # One model at a time, held in VRAM indefinitely. The 16 GB card can
      # only fit one of these models, so loading a second is never wanted:
      # MAX_LOADED_MODELS=1 makes ollama evict the resident model instead of
      # trying to co-locate and spilling layers to CPU.
      - OLLAMA_KEEP_ALIVE=-1  # -1 means "never unload"
      - OLLAMA_MAX_LOADED_MODELS=1
      # Ollama's own default lands on 4096 here, which is below OpenClaw's 16000
      # minimum and stops the agent from running at all. 16384 is the largest
      # value that keeps all three models at 100% GPU on a 16 GB card: gpt-oss
      # (MoE) also fits 32768, but the dense models spill to CPU there.
      - OLLAMA_CONTEXT_LENGTH=16384
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - ai-network

  model-loader:
    image: ollama/ollama:latest
    container_name: model-loader
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      # Note: "$$" escapes Compose's own variable interpolation, so the shell
      # sees a single "$". The ollama image ships no curl/wget/python, so every
      # step here goes through the ollama CLI.
      - |
        echo "Waiting for Ollama API..."
        until ollama list > /dev/null 2>&1; do
          echo "Ollama not ready, retrying in 5s..."
          sleep 5
        done
        echo "Ollama is ready."

        failed=""
        for model in \
          qwen2.5-coder:14b \
          gpt-oss:20b \
          hf.co/ServiceNow-AI/Apriel-1.6-15b-Thinker-GGUF:Q4_K_M
        do
          echo "Pulling $$model..."
          if ollama pull "$$model"; then
            echo "Model $$model pulled successfully."
          else
            echo "ERROR: failed to pull $$model" >&2
            failed="$$failed $$model"
          fi
        done

        # Preload into VRAM so the first real request isn't a cold start.
        # OLLAMA_KEEP_ALIVE=-1 on the ollama service keeps it resident.
        echo "Pre-loading gpt-oss:20b into memory..."
        if ollama run gpt-oss:20b "" > /dev/null 2>&1; then
          echo "Model gpt-oss:20b loaded into memory."
        else
          echo "ERROR: failed to pre-load gpt-oss:20b" >&2
          failed="$$failed preload:gpt-oss:20b"
        fi

        if [ -n "$$failed" ]; then
          echo "model-loader finished with failures:$$failed" >&2
          exit 1
        fi
        echo "model-loader completed successfully."
    restart: "no"
    networks:
      - ai-network

  openclaw:
    image: ghcr.io/openclaw/openclaw:latest
    container_name: openclaw
    restart: unless-stopped
    # Depends on ollama itself, not model-loader: a failed model pull should
    # not keep the Slack gateway down on every boot.
    depends_on:
      ollama:
        condition: service_healthy
    command: ["node", "openclaw.mjs", "gateway", "--allow-unconfigured", "--bind", "lan"]
    ports:
      - "18789:18789"
      - "18791:18791"
    volumes:
      - ./openclaw-state:/home/node/.openclaw
      # Only the agent's own key, not all of ~/.ssh. The power scripts use
      # openclaw_ed25519 exclusively (and pass StrictHostKeyChecking=no /
      # UserKnownHostsFile=/dev/null, so no known_hosts is needed). Mounting the
      # whole directory also exposed id_ed25519, which authenticates as root on
      # vault — a prompt-injected agent could read it straight off disk.
      - /home/robby/.ssh/openclaw_ed25519:/home/node/.ssh/openclaw_ed25519:ro
    environment:
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN}
      - OLLAMA_API_KEY=ollama-local
      - SLACK_APP_TOKEN=${SLACK_APP_TOKEN}
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN}
      - BRAVE_API_KEY=${BRAVE_API_KEY}
    networks:
      - ai-network

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    # As with openclaw: ollama being up is what matters, not the model pulls.
    depends_on:
      ollama:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - openwebui_data:/app/backend/data
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ai-network

volumes:
  ollama_data:
  openwebui_data:

networks:
  ai-network:
    driver: bridge
