# Project name is pinned so volume names don't depend on this folder's path.
name: forge

services:
  ollama:
    # Pinned to what was running. :latest only moves on `docker compose pull`,
    # which nothing here does on a schedule, so the tag was never telling the
    # truth about the version — and a silent ollama change moves the agent's
    # inference behaviour underneath it.
    image: ollama/ollama:0.17.5
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      # One model at a time, held in VRAM indefinitely. The 16 GB card can
      # only fit one of these models, so loading a second is never wanted:
      # MAX_LOADED_MODELS=1 makes ollama evict the resident model instead of
      # trying to co-locate and spilling layers to CPU.
      - OLLAMA_KEEP_ALIVE=-1  # -1 means "never unload"
      - OLLAMA_MAX_LOADED_MODELS=1
      # Ollama's own default lands on 4096 here, which is below OpenClaw's 16000
      # minimum and stops the agent from running at all. 16384 is the largest
      # value that keeps all three models at 100% GPU on a 16 GB card: gpt-oss
      # (MoE) also fits 32768, but the dense models spill to CPU there.
      - OLLAMA_CONTEXT_LENGTH=16384
    # The GPU is handed in through CDI (since 2026-10-09), not the legacy nvidia runtime hook.
    # The hook granted the device with cgroup rules that every `systemctl daemon-reload` wiped
    # -- snapd's refresh check and the daily apt job both trigger one -- after which the
    # container lost the card ("NVML: Unknown Error") while the host kept it, and gpu-guard.sh
    # restarted ollama four mornings out of ten. CDI declares the devices from
    # /etc/cdi/nvidia.yaml (`sudo nvidia-ctk cdi generate --output=/etc/cdi/nvidia.yaml`, redo
    # after a driver upgrade) and survives reloads. Docker 29 has CDI on by default.
    devices:
      - nvidia.com/gpu=all
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - ai-network

  model-loader:
    # Same image as the ollama service; keep the two in step.
    image: ollama/ollama:0.17.5
    container_name: model-loader
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      # Note: "$$" escapes Compose's own variable interpolation, so the shell
      # sees a single "$". The ollama image ships no curl/wget/python, so every
      # step here goes through the ollama CLI.
      - |
        echo "Waiting for Ollama API..."
        until ollama list > /dev/null 2>&1; do
          echo "Ollama not ready, retrying in 5s..."
          sleep 5
        done
        echo "Ollama is ready."

        failed=""
        for model in \
          qwen2.5-coder:14b \
          gpt-oss:20b \
          hf.co/ServiceNow-AI/Apriel-1.6-15b-Thinker-GGUF:Q4_K_M
        do
          echo "Pulling $$model..."
          if ollama pull "$$model"; then
            echo "Model $$model pulled successfully."
          else
            echo "ERROR: failed to pull $$model" >&2
            failed="$$failed $$model"
          fi
        done

        # Preload into VRAM so the first real request isn't a cold start.
        # OLLAMA_KEEP_ALIVE=-1 on the ollama service keeps it resident.
        echo "Pre-loading gpt-oss:20b into memory..."
        if ollama run gpt-oss:20b "" > /dev/null 2>&1; then
          echo "Model gpt-oss:20b loaded into memory."
        else
          echo "ERROR: failed to pre-load gpt-oss:20b" >&2
          failed="$$failed preload:gpt-oss:20b"
        fi

        if [ -n "$$failed" ]; then
          echo "model-loader finished with failures:$$failed" >&2
          exit 1
        fi
        echo "model-loader completed successfully."
    restart: "no"
    networks:
      - ai-network

  openclaw:
    # Pinned deliberately. Bump by hand from the runbook at
    # .claude/skills/homelab-upgrades/packages/openclaw.md, which says how to
    # rehearse the migration on a copy of the state dir first. No "how far behind"
    # note here: the previous one said two months when it had become six.
    image: ghcr.io/openclaw/openclaw:2026.9.6
    container_name: openclaw
    restart: unless-stopped
    # Depends on ollama itself, not model-loader: a failed model pull should
    # not keep the Slack gateway down on every boot.
    depends_on:
      ollama:
        condition: service_healthy
    command: ["node", "openclaw.mjs", "gateway", "--allow-unconfigured", "--bind", "lan"]
    ports:
      - "18789:18789"
      - "18791:18791"
    volumes:
      # Live agent state lives outside the repo and the deployed copy, like bastion's
      # vw-data. A relative path would resolve against whichever copy of this file
      # started the stack, and a deploy would then hand the agent an empty state dir.
      - /home/robby/openclaw-state:/home/node/.openclaw
      # Only the agent's own key, not all of ~/.ssh. The power scripts reference
      # openclaw_ed25519 explicitly at every call site, and keep their known_hosts
      # under /home/node/.openclaw (the state bind mount) because this directory is
      # read-only and the container filesystem does not survive a recreate.
      # Mounting the whole directory also exposed id_ed25519, which authenticates as
      # root on vault — a prompt-injected agent could read it straight off disk.
      - /home/robby/.ssh/openclaw_ed25519:/home/node/.ssh/openclaw_ed25519:ro
    environment:
      # The ONLY source of the gateway token. openclaw.json used to carry a literal
      # one as well, which meant a live credential sat in git on every clone — and
      # this gateway binds to the LAN with tools.exec.mode "full", so
      # that token is remote code execution to anyone holding it. Keep it here.
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN}
      - OLLAMA_API_KEY=ollama-local
      - SLACK_APP_TOKEN=${SLACK_APP_TOKEN}
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN}
    networks:
      - ai-network

  open-webui:
    # `main` is a branch tag: it moves whenever upstream pushes. Pinned to the
    # version that was running.
    image: ghcr.io/open-webui/open-webui:0.8.8
    container_name: open-webui
    restart: unless-stopped
    # As with openclaw: ollama being up is what matters, not the model pulls.
    depends_on:
      ollama:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - openwebui_data:/app/backend/data
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ai-network

  # --- observability exporters (docs/plan-observability.md) -------------------------------
  # Host network so they see the real interfaces and cgroups and so a host firewall applies
  # to them; Prometheus on bastion scrapes 9100 and 9200. Same two services on every host.
  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: node-exporter
    restart: unless-stopped
    network_mode: host
    pid: host
    command:
      - --path.rootfs=/host
      - --web.listen-address=:9100
    volumes:
      - /:/host:ro,rslave

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    container_name: cadvisor
    restart: unless-stopped
    network_mode: host
    command:
      - --port=9200
      - --housekeeping_interval=30s
      - --docker_only=true
      - --store_container_labels=false
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg

  # --- log shipping (docs/plan-observability.md) ---------------------------------------------
  # Alloy reads journald and container logs and pushes them to Loki on bastion. It reaches the
  # Docker API only through the socket proxy below, which permits read-only container calls
  # and nothing else -- the real socket would be root on this host.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    container_name: docker-proxy
    restart: unless-stopped
    environment:
      - CONTAINERS=1
      # Alloy's Docker discovery also lists networks to label targets; both are GET-only.
      - NETWORKS=1
      - POST=0
      - LOG_LEVEL=warning
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - ai-network

  alloy:
    image: grafana/alloy:v1.20.0
    container_name: alloy
    restart: unless-stopped
    depends_on:
      - docker-proxy
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      - ALLOY_HOST=forge
      - LOKI_URL=https://loki.robbywhite.net/loki/api/v1/push
      - LOKI_USER=${LOKI_USER}
      - LOKI_PASSWORD=${LOKI_PASSWORD}
    volumes:
      # The one config for every host; shared/alloy/ lands in scripts/ on deploy.
      - ./scripts/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/log/journal:/var/log/journal:ro
      - /run/log/journal:/run/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
      - alloy_data:/var/lib/alloy/data
    networks:
      - ai-network

volumes:
  ollama_data:
  openwebui_data:
  alloy_data:

networks:
  ai-network:
    driver: bridge
