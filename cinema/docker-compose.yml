# Pinned so `docker compose` adopts the existing `plex` project regardless of
# which directory it is run from.
name: plex

services:
  plex:
    container_name: plex
    # Pinned to the version that was running, like every other image here. Plex's
    # own tags carry the build hash, and the running server reports the same string
    # at http://192.168.0.13:32400/identity — so the deployed version can be read
    # back without a shell on this host.
    image: plexinc/pms-docker:1.43.2.10687-563d026ea
    restart: unless-stopped
    network_mode: host
    environment:
      - TZ=America/Chicago
      # Only needed on first run to claim a new server; see .env.example
      - PLEX_CLAIM=${PLEX_CLAIM:-}
    volumes:
      # Absolute paths: the stack was originally started with sudo, so `~`
      # resolved to /root. Keep these pointing at the existing library/config.
      - /root/plex/config:/config
      - /root/plex/transcode:/transcode
      - /mnt/storage/plex:/data

  # --- observability exporters (docs/plan-observability.md) -------------------------------
  # Host network so they see the real interfaces and cgroups and so a host firewall applies
  # to them; Prometheus on bastion scrapes 9100 and 9200. Same two services on every host.
  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: node-exporter
    restart: unless-stopped
    network_mode: host
    pid: host
    command:
      - --path.rootfs=/host
      - --web.listen-address=:9100
    volumes:
      - /:/host:ro,rslave

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    container_name: cadvisor
    restart: unless-stopped
    network_mode: host
    command:
      - --port=9200
      - --housekeeping_interval=30s
      - --docker_only=true
      - --store_container_labels=false
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg

  # --- log shipping (docs/plan-observability.md) ---------------------------------------------
  # Alloy reads journald and container logs and pushes them to Loki on bastion. It reaches the
  # Docker API only through the socket proxy below, which permits read-only container calls
  # and nothing else -- the real socket would be root on this host.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    container_name: docker-proxy
    restart: unless-stopped
    environment:
      - CONTAINERS=1
      - POST=0
      - LOG_LEVEL=warning
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  alloy:
    image: grafana/alloy:v1.20.0
    container_name: alloy
    restart: unless-stopped
    depends_on:
      - docker-proxy
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      - ALLOY_HOST=cinema
      - LOKI_URL=https://loki.robbywhite.net/loki/api/v1/push
      - LOKI_USER=${LOKI_USER}
      - LOKI_PASSWORD=${LOKI_PASSWORD}
    volumes:
      # The one config for every host; shared/alloy/ lands in scripts/ on deploy.
      - ./scripts/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/log/journal:/var/log/journal:ro
      - /run/log/journal:/run/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
      - alloy_data:/var/lib/alloy/data

volumes:
  alloy_data:
